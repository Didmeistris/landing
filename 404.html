<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | KrasMatrix</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main:    #0c0e12;
      --bg-card:    #151820;
      --border:     #262b36;
      --yellow:     #FDE02F;
      --yellow-glow:rgba(253,224,47,0.25);
      --pink:       #FF107A;
      --blue:       #229ED9;
      --text:       #ffffff;
      --muted:      #94a1b2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── фоновые декоры ─────────────────────────────── */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 600px;
      background: radial-gradient(ellipse at center,
        rgba(253,224,47,0.07) 0%,
        rgba(255,16,122,0.04) 40%,
        transparent 70%);
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -10%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle,
        rgba(34,158,217,0.06) 0%,
        transparent 70%);
    }

    /* ── шапка ─────────────────────────────────────── */
    .nav-logo {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      font-family: 'Unbounded', sans-serif;
      font-size: 20px; font-weight: 900;
      color: #fff; text-decoration: none;
      display: flex; align-items: center; gap: 4px;
      z-index: 10;
    }
    .nav-logo span {
      background: var(--yellow); color: #000;
      padding: 2px 6px; border-radius: 6px; font-size: 18px;
    }

    /* ── центральный контейнер ──────────────────────── */
    .container-404 {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: 20px;
      max-width: 700px;
      animation: fadeUp 0.8s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── SVG кот + цифры ────────────────────────────── */
    .illustration {
      width: 100%;
      max-width: 540px;
      margin-bottom: 32px;
      filter: drop-shadow(0 20px 60px rgba(253,224,47,0.12));
      animation: floatCat 5s ease-in-out infinite;
    }
    @keyframes floatCat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* ── текст ──────────────────────────────────────── */
    .label-404 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(13px, 2vw, 15px);
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 16px;
      background: rgba(253,224,47,0.08);
      padding: 6px 20px;
      border-radius: 100px;
      border: 1px solid rgba(253,224,47,0.2);
    }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    h1 span { color: var(--yellow); }
    p.desc {
      font-size: clamp(15px, 2vw, 17px);
      color: var(--muted);
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    /* ── кнопки ─────────────────────────────────────── */
    .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 15px 32px;
      border-radius: 12px;
      font-size: 15px; font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--yellow); color: #000;
      box-shadow: 0 4px 20px var(--yellow-glow);
    }
    .btn-primary:hover {
      background: #ffea5c;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--yellow-glow);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
    }
    .btn-outline:hover {
      background: var(--bg-card);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    /* ── крошки снизу ───────────────────────────────── */
    .hint {
      position: fixed; bottom: 28px;
      font-size: 13px; color: var(--muted);
      z-index: 1;
    }
    .hint a { color: var(--blue); text-decoration: none; }
    .hint a:hover { color: #fff; }

    @media (max-width: 480px) {
      .btns { flex-direction: column; align-items: center; width: 100%; }
      .btn { width: 100%; justify-content: center; }
      .nav-logo { font-size: 16px; }
    }
  </style>
</head>
