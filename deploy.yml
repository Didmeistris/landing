name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Запуск при пуше в main
  schedule:
    - cron: "17 * * * *"
    - cron: "5 21 * * *" # First daily refresh shortly after midnight in Moscow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Restore last successful site data
        uses: actions/cache@v4
        with:
          path: |
            public/news.json
            public/pricing.json
          key: site-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-data-v2-

      - name: Collect official news
        run: python3 scripts/update_news.py

      - name: Collect current-day exchange rates
        run: python3 scripts/update_pricing.py

      - name: Test news handling
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.js

      - name: Build project
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite по умолчанию собирает всё в папку dist
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
